name: J2K Validate

on:
  push:
    branches:
      - 'j2k/current'
      - 'j2k/**'
  pull_request:
    branches:
      - 'j2k/current'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j2k-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 22.22.0
  NPM_VERSION: 11.6.2

jobs:
  validate:
    name: Typecheck, lint, test, build, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up exact Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify toolchain identity
        run: |
          set -euo pipefail
          test "$(bun --version)" = "1.3.14"
          test "$(node --version)" = "v$NODE_VERSION"
          npm install --global "npm@$NPM_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
          test "$(node -p 'require(`./package.json`).packageManager')" = "bun@1.3.14"

      - name: Capture exact validation runtime target
        run: |
          set -euo pipefail
          {
            printf 'TARGET_PLATFORM=%s\n' "$(node -p 'process.platform')"
            printf 'TARGET_ARCH=%s\n' "$(node -p 'process.arch')"
            printf 'TARGET_NODE_ABI=%s\n' "$(node -p 'process.versions.modules')"
          } >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          bun install --frozen-lockfile

      - name: Typecheck
        run: |
          set -euo pipefail
          bun run type-check

      - name: Lint
        run: |
          set -euo pipefail
          bun run lint

      - name: Test
        run: |
          set -euo pipefail
          bun run test

      - name: Build
        run: |
          set -euo pipefail
          bun run build

      - name: Pack and validate relocatable web artifact
        id: pack
        run: |
          set -euo pipefail
          mkdir artifacts
          package_version="$(node -p 'require(`./packages/web/package.json`).version')"
          tarball="openchamber-web-$package_version.tgz"
          node tools/channel-release/channel-release.mjs pack-package \
            --version "$package_version" \
            --source-commit "${{ github.sha }}" \
            --platform "$TARGET_PLATFORM" \
            --arch "$TARGET_ARCH" \
            --node-abi "$TARGET_NODE_ABI" \
            --output-dir artifacts
          node tools/channel-release/channel-release.mjs verify-package \
            --tarball "artifacts/$tarball" \
            --version "$package_version" \
            --source-commit "${{ github.sha }}" \
            --platform "$TARGET_PLATFORM" \
            --arch "$TARGET_ARCH" \
            --node-abi "$TARGET_NODE_ABI"
          printf 'tarball=%s\nversion=%s\n' "$tarball" "$package_version" >> "$GITHUB_OUTPUT"

      - name: Smoke installed web artifact
        run: |
          set -euo pipefail
          node tools/channel-release/smoke-installed-package.mjs \
            --tarball "artifacts/${{ steps.pack.outputs.tarball }}" \
            --version "${{ steps.pack.outputs.version }}" \
            --source-commit "${{ github.sha }}" \
            --platform "$TARGET_PLATFORM" \
            --arch "$TARGET_ARCH" \
            --node-abi "$TARGET_NODE_ABI"

      - name: Upload validated web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-web-${{ github.sha }}
          path: artifacts/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  report-release-branch-result:
    name: Report release branch validation
    needs: validate
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref_name, 'j2k/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - name: Check out trusted recovery renderer
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Defer failure recovery to trusted workflow-run handler
        env:
          GH_TOKEN: ${{ github.token }}
          OPM_RECOVERY_GITHUB_TOKEN: ''
          BRANCH: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          RESULT: ${{ needs.validate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$BRANCH" =~ ^j2k/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ignoring non-release branch $BRANCH."
            exit 0
          fi
          if [[ "$RESULT" == 'success' ]]; then
            exit 0
          fi

          if [[ -z "$OPM_RECOVERY_GITHUB_TOKEN" ]]; then
            echo 'OPM_RECOVERY_GITHUB_TOKEN is required to create an owner-authored recovery issue.' >&2
            exit 1
          fi
          git init recovery-repository
          git -C recovery-repository remote add origin "https://github.com/${{ github.repository }}.git"
          git -C recovery-repository remote add upstream https://github.com/openchamber/openchamber.git
          git -C recovery-repository fetch --no-tags origin \
            "+refs/heads/$BRANCH:refs/remotes/origin/candidate" \
            '+refs/heads/j2k/current:refs/remotes/origin/current'
          git -C recovery-repository fetch --tags upstream main
          test "$(git -C recovery-repository rev-parse refs/remotes/origin/candidate)" = "$SOURCE_COMMIT"
          upstream_tag="v${BRANCH#j2k/v}"
          upstream_commit="$(git -C recovery-repository rev-parse "$upstream_tag^{commit}")"
          series_commit="$(git -C recovery-repository rev-parse refs/remotes/origin/current)"
          previous_base="$(git -C recovery-repository describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-j2k.*' --abbrev=0 "$series_commit")"

          jobs="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100")"
          failed_steps="$(JOBS="$jobs" node -e '
            const jobs = JSON.parse(process.env.JOBS).jobs;
            const names = jobs.flatMap((job) => job.steps || []).filter((step) => step.conclusion === "failure").map((step) => step.name);
            process.stdout.write(names.join(", "));
          ')"
          case "$failed_steps" in
            *'Install locked dependencies'*) failed_command='bun install --frozen-lockfile' ;;
            *Typecheck*) failed_command='bun run type-check' ;;
            *Lint*) failed_command='bun run lint' ;;
            *Test*) failed_command='bun run test' ;;
            *Build*) failed_command='bun run build' ;;
            *'Pack and validate relocatable web artifact'*) failed_command='node tools/channel-release/channel-release.mjs pack-package && node tools/channel-release/channel-release.mjs verify-package' ;;
            *'Smoke installed web artifact'*) failed_command='node tools/channel-release/smoke-installed-package.mjs' ;;
            *) failed_command="J2K Validate failed step: ${failed_steps:-unknown}" ;;
          esac
          logs="$(gh run view "${{ github.run_id }}" --repo "${{ github.repository }}" --log-failed 2>&1)"
          logs="${logs:0:60000}"
          recovery="$RUNNER_TEMP/upstream-recovery.json"
          body="$RUNNER_TEMP/validation-failure.md"
          title_file="$RUNNER_TEMP/validation-failure-title"
          UPSTREAM_TAG="$upstream_tag" UPSTREAM_COMMIT="$upstream_commit" PREVIOUS_BASE="$previous_base" \
            SERIES_COMMIT="$series_commit" BRANCH="$BRANCH" SOURCE_COMMIT="$SOURCE_COMMIT" \
            FAILED_COMMAND="$failed_command" LOGS="$logs" RUN_URL="$RUN_URL" RECOVERY="$recovery" node <<'NODE'
          const { writeFileSync } = require('node:fs');
          writeFileSync(process.env.RECOVERY, JSON.stringify({
            failureKind: 'semantic-failure',
            upstreamRepository: 'openchamber/openchamber',
            upstreamTag: process.env.UPSTREAM_TAG,
            upstreamCommit: process.env.UPSTREAM_COMMIT,
            previousBaseTag: process.env.PREVIOUS_BASE,
            patchSeriesSourceCommit: process.env.SERIES_COMMIT,
            candidateBranch: process.env.BRANCH,
            candidateCommit: process.env.SOURCE_COMMIT,
            failedCommand: process.env.FAILED_COMMAND,
            logs: process.env.LOGS,
            workflowUrl: process.env.RUN_URL,
            recreateCommands: [
              'git fetch origin j2k/current ' + process.env.BRANCH,
              'git switch --force-create ' + process.env.BRANCH + ' ' + process.env.SOURCE_COMMIT,
              process.env.FAILED_COMMAND,
            ],
          }, null, 2));
          NODE
          node tools/desktop-release/upstream-recovery.mjs --input "$recovery" --body "$body" --title "$title_file"
          title="$(<"$title_file")"

          export GH_TOKEN="$OPM_RECOVERY_GITHUB_TOKEN"
          owner_login="$(gh api user --jq '.login')"
          owner_id="$(gh api user --jq '.id')"
          test "$owner_id" = '38769771'
          issue_number="$(gh issue list --repo "${{ github.repository }}" --state all --search "in:title $title" \
            --json number,title,author --jq "map(select(.title == \"$title\" and .author.login == \"$owner_login\")) | first | .number // empty")"
          if [[ -z "$issue_number" ]]; then
            gh issue create --repo "${{ github.repository }}" --title "$title" --body-file "$body" --label opm:ready
          else
            gh issue edit "$issue_number" --repo "${{ github.repository }}" --body-file "$body"
            state="$(gh issue view "$issue_number" --repo "${{ github.repository }}" --json state --jq .state)"
            if [[ "$state" != 'OPEN' ]]; then
              gh issue reopen "$issue_number" --repo "${{ github.repository }}"
            fi
            gh issue edit "$issue_number" --repo "${{ github.repository }}" --add-label opm:ready
          fi
