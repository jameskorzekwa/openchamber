name: J2K Release Recovery

on:
  workflow_run:
    workflows:
      - J2K Validate
      - J2K Release
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: j2k-release-recovery-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  report:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.name == 'J2K Release' ||
       (github.event.workflow_run.name == 'J2K Validate' && startsWith(github.event.workflow_run.head_branch, 'j2k/v')))
    runs-on: ubuntu-latest
    environment: j2k-release
    steps:
      - name: Check out trusted recovery renderer
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create or update recovery issue
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_COMMIT: ${{ github.event.workflow_run.head_sha }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if [[ "$FAILED_WORKFLOW" == 'J2K Validate' ]]; then
            BRANCH="$EVENT_BRANCH"
            SOURCE_COMMIT="$EVENT_COMMIT"
          else
            gh run download "$FAILED_RUN_ID" --repo "${{ github.repository }}" --name release-identity --dir "$RUNNER_TEMP/release-identity"
            BRANCH="$(node -p 'require(process.argv[1]).branch' "$RUNNER_TEMP/release-identity/release-trigger.json")"
            SOURCE_COMMIT="$(node -p 'require(process.argv[1]).commit' "$RUNNER_TEMP/release-identity/release-trigger.json")"
            SERIES_COMMIT="$(node -p 'require(process.argv[1]).patchSeriesSourceCommit || ``' "$RUNNER_TEMP/release-identity/release-trigger.json")"
            PREVIOUS_BASE="$(node -p 'require(process.argv[1]).previousBaseTag || ``' "$RUNNER_TEMP/release-identity/release-trigger.json")"
          fi
          git remote add upstream https://github.com/openchamber/openchamber.git
          # Upstream tags get their own namespace outside refs/tags, which the
          # fork checkout cannot populate, so no fork tag can stand in for an
          # upstream release. Upstream identity resolves only from it.
          git for-each-ref --format='delete %(refname)' refs/upstream-tags/ | git update-ref --stdin
          git fetch --no-tags upstream '+refs/heads/main:refs/remotes/upstream/main' '+refs/tags/v*:refs/upstream-tags/v*'
          maintained_head=''
          if [[ "$BRANCH" == 'j2k/current' ]]; then
            # Publication only follows j2k/current, so the branch names no
            # upstream version. Pin the report to the exact commit the failed
            # release checked; it must still be in maintained history, which
            # may since have advanced.
            [[ "$FAILED_WORKFLOW" == 'J2K Release' && "$EVENT_BRANCH" == 'j2k/current' ]]
            if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Release identity of run $FAILED_RUN_ID has no exact source commit: '$SOURCE_COMMIT'." >&2
              exit 1
            fi
            git fetch origin '+refs/heads/j2k/current:refs/remotes/origin/current'
            maintained_head="$(git rev-parse refs/remotes/origin/current)"
            if ! git merge-base --is-ancestor "$SOURCE_COMMIT" "$maintained_head" 2>/dev/null; then
              echo "::error::Failed release source $SOURCE_COMMIT is not in j2k/current history at $maintained_head." >&2
              exit 1
            fi
            # The base is the newest stable upstream release on upstream main
            # in the failed commit's history.
            upstream_tag=''
            while IFS= read -r tag; do
              if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
                && git merge-base --is-ancestor "refs/upstream-tags/$tag" refs/remotes/upstream/main; then
                upstream_tag="$tag"
                break
              fi
            done < <(git for-each-ref --merged="$SOURCE_COMMIT" --sort=-version:refname --format='%(refname:strip=2)' refs/upstream-tags/)
            if [[ -z "$upstream_tag" ]]; then
              echo "::error::Failed release source $SOURCE_COMMIT contains no stable upstream release." >&2
              exit 1
            fi
            default_series="$SOURCE_COMMIT"
            PREVIOUS_BASE="${PREVIOUS_BASE:-$upstream_tag}"
          elif [[ "$BRANCH" =~ ^j2k/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/candidate" '+refs/heads/j2k/current:refs/remotes/origin/current'
            git fetch --tags upstream main
            if [[ -z "$SOURCE_COMMIT" ]]; then
              SOURCE_COMMIT="$(git rev-parse refs/remotes/origin/candidate)"
            fi
            test "$(git rev-parse refs/remotes/origin/candidate)" = "$SOURCE_COMMIT"
            upstream_tag="v${BRANCH#j2k/v}"
            default_series="$(git rev-parse refs/remotes/origin/current)"
          else
            echo "::error::Run $FAILED_RUN_ID names no recoverable branch: '$BRANCH'." >&2
            exit 1
          fi
          [[ "$upstream_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if ! upstream_commit="$(git rev-parse --verify --quiet "refs/upstream-tags/$upstream_tag^{commit}")"; then
            echo "::error::$upstream_tag is not an upstream release tag." >&2
            exit 1
          fi
          series_commit="${SERIES_COMMIT:-$default_series}"
          previous_base="${PREVIOUS_BASE:-$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-j2k.*' --abbrev=0 "$series_commit")}"
          [[ "$series_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$previous_base" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ -n "${maintained_head:-}" ]] && ! git rev-parse --verify --quiet "refs/upstream-tags/$previous_base^{commit}" >/dev/null; then
            echo "::error::Previous base $previous_base is not an upstream release tag." >&2
            exit 1
          fi
          jobs="$(gh api "repos/${{ github.repository }}/actions/runs/$FAILED_RUN_ID/jobs?per_page=100")"
          failed_steps="$(JOBS="$jobs" node -e '
            const jobs = JSON.parse(process.env.JOBS).jobs;
            process.stdout.write(jobs.flatMap((job) => (job.steps || []).filter((step) => step.conclusion === "failure").map((step) => `${step.name} [job ${job.name}]`)).join(", "));
          ')"
          logs="$(gh run view "$FAILED_RUN_ID" --repo "${{ github.repository }}" --log-failed 2>&1)"
          logs="${logs:0:60000}"
          failed_command="gh workflow run release.yml --ref j2k/current -f source_ref=$BRANCH"
          recovery="$RUNNER_TEMP/upstream-recovery.json"
          body="$RUNNER_TEMP/release-failure.md"
          title_file="$RUNNER_TEMP/release-failure-title"
          UPSTREAM_TAG="$upstream_tag" UPSTREAM_COMMIT="$upstream_commit" PREVIOUS_BASE="$previous_base" \
            SERIES_COMMIT="$series_commit" BRANCH="$BRANCH" SOURCE_COMMIT="$SOURCE_COMMIT" \
            FAILED_COMMAND="$failed_command" FAILED_STEPS="$failed_steps" LOGS="$logs" RUN_URL="$RUN_URL" RECOVERY="$recovery" \
            MAINTAINED_HEAD="$maintained_head" node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const env = process.env;
          // A maintained failure is repaired on a neutral branch, which J2K
          // Validate checks without publication; nothing here writes j2k/current.
          const neutral = `recovery/upstream-${env.UPSTREAM_TAG}-release-${env.FAILED_RUN_ID}`;
          const recreateCommands = env.MAINTAINED_HEAD ? [
            'git fetch origin j2k/current',
            `git switch --create ${neutral} ${env.SOURCE_COMMIT}`,
            `# Repair on ${neutral}; integrating it into j2k/current needs owner approval.`,
            `# Only after owner approval, re-run publication manually: ${env.FAILED_COMMAND}`,
          ] : [
            'git fetch origin j2k/current ' + env.BRANCH,
            'git switch --force-create ' + env.BRANCH + ' ' + env.SOURCE_COMMIT,
            env.FAILED_COMMAND,
          ];
          writeFileSync(process.env.RECOVERY, JSON.stringify({
            failureKind: 'semantic-failure',
            upstreamRepository: 'openchamber/openchamber',
            upstreamTag: process.env.UPSTREAM_TAG,
            upstreamCommit: process.env.UPSTREAM_COMMIT,
            previousBaseTag: process.env.PREVIOUS_BASE,
            patchSeriesSourceCommit: process.env.SERIES_COMMIT,
            candidateBranch: process.env.BRANCH,
            candidateCommit: process.env.SOURCE_COMMIT,
            failedCommand: `${process.env.FAILED_COMMAND} # failed steps: ${process.env.FAILED_STEPS || 'unknown'}`,
            logs: process.env.LOGS,
            workflowUrl: process.env.RUN_URL,
            ...(env.MAINTAINED_HEAD ? { failedRunId: env.FAILED_RUN_ID, maintainedHeadCommit: env.MAINTAINED_HEAD } : {}),
            recreateCommands,
          }, null, 2));
          NODE
          node tools/desktop-release/upstream-recovery.mjs --input "$recovery" --body "$body" --title "$title_file"
          title="$(<"$title_file")"

          issue_number="$(gh issue list --repo "${{ github.repository }}" --state all --search "in:title $title" \
            --json number,title --jq "map(select(.title == \"$title\")) | first | .number // empty")"
          if [[ -z "$issue_number" ]]; then
            gh issue create --repo "${{ github.repository }}" --title "$title" --body-file "$body"
          elif [[ "$BRANCH" == 'j2k/current' ]]; then
            # Publication closes this title; earlier failures stay as evidence.
            gh issue comment "$issue_number" --repo "${{ github.repository }}" --body-file "$body"
            gh issue reopen "$issue_number" --repo "${{ github.repository }}" 2>/dev/null || true
          else
            gh issue edit "$issue_number" --repo "${{ github.repository }}" --body-file "$body"
            gh issue reopen "$issue_number" --repo "${{ github.repository }}" 2>/dev/null || true
          fi
