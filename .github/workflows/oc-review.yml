name: pr checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Prepare exact OpenCode restart-test binary
        env:
          OPENCHAMBER_OPENCODE_CLI_VERSION: 1.18.29
        run: |
          set -euo pipefail
          bun run --cwd packages/electron prepare:opencode-cli
          binary="$GITHUB_WORKSPACE/packages/electron/resources/opencode-cli/opencode"
          test "$("$binary" --version)" = "$OPENCHAMBER_OPENCODE_CLI_VERSION"
          printf 'OPENCODE_BINARY=%s\n' "$binary" >> "$GITHUB_ENV"

      - name: Tests
        run: bun run test

      - name: Real OpenCode restart recovery
        env:
          OPENCODE_REAL_TEST: 1
          OPENCODE_REAL_TEST_REQUIRED: 1
        run: bun run --cwd packages/web test -- server/lib/session-goal/managed-goal-stale-recovery.real.test.js

      - name: Electron Linux packaging unit tests
        working-directory: packages/electron
        run: |
          bun run test:architecture
          bun run test:updater
          bun run type-check
